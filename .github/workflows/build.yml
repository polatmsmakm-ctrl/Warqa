name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project Warqa.xcodeproj \
            -scheme Warqa \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Warqa.app Payload/
          zip -qr Warqa.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Warqa-ipa
          path: Warqa.ipa

      - name: Publish IPA to ipa branch
        run: |
          mkdir -p /tmp/out && cp Warqa.ipa /tmp/out/
          cd /tmp/out
          git init -q -b ipa
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Warqa.ipa
          git commit -q -m "IPA build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ipa
